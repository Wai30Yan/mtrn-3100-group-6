[package]
name = "micromouse-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
cortex-m-semihosting = "0.5.0"

embedded-alloc = "0.6.0"
embedded-io = "0.6.1"

stm32g4 = { version = "0.16.0", features = ["rt", "stm32g431"] }
stm32g4xx-hal = { version = "0.1.0", features = ["stm32g431", "rt", "usb"] }

nb = "1.1.0"
fugit = "0.3.9"
usbd-serial = "0.2.2"
usb-device = "0.3.2"
nalgebra = { version = "0.35.0", default-features = false, features = [ "libm", "alloc" ] }
ssd1306 = "0.10.0"
embedded-hal-bus = "0.3.0"

# allows use of `cargo fix`
[[bin]]
name = "micromouse-rs"
test = false
bench = false

[profile.release]
codegen-units = 1 # better optimizations
debug = true # symbols are nice and they don't increase the size on Flash
lto = true # better optimizations
